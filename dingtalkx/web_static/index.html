<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DingAgentX</title>
<style>
/* ============================================================
   设计令牌
   颜色只写在这里,组件只用语义名。层次靠 4-8% 墨色填充,文字靠透明度。
   按钮和徽章是胶囊。强调色只有一个:钉钉蓝。
   ============================================================ */
:root, .light {
  color-scheme: light;
  --bg: #ffffff;
  --surface-1: #f4f5f7;
  --surface-2: #e6e7ec;
  --surface-3: #ffffff;
  --fg-1: rgb(13 13 13 / .94);
  --fg-2: rgb(13 13 13 / .64);
  --fg-3: rgb(13 13 13 / .5);
  --fg-4: rgb(13 13 13 / .36);
  --line-1: rgb(13 13 13 / .06);
  --line-2: rgb(13 13 13 / .1);
  --line-3: rgb(13 13 13 / .16);
  --fill-1: rgb(13 13 13 / .03);
  --fill-2: rgb(13 13 13 / .05);
  --fill-3: rgb(13 13 13 / .08);
  --invert: #0d0d0d;
  --invert-fg: #ffffff;
  --accent: #0089ff;
  --accent-strong: #0069c8;
  --accent-fg: #ffffff;
  --accent-soft: rgb(0 137 255 / .1);
  --accent-ring: rgb(0 137 255 / .4);
  --success: #0f7a46;
  --warning: #b45309;
  --danger: #cc2f36;
  --success-soft: rgb(15 122 70 / .1);
  --warning-soft: rgb(180 83 9 / .1);
  --danger-soft: rgb(204 47 54 / .1);
  --chart-in: #0089ff;
  --chart-out: #009e86;
  --scrim: rgb(120 120 120 / .5);
  --menu-fill: rgb(255 255 255 / .92);
  --shadow-raised: 0 0 0 1px var(--line-1), 0 1px 2px 0 rgb(13 13 13 / .05);
  --shadow-overlay: 0 0 0 1px var(--line-1), 0 12px 40px -8px rgb(13 13 13 / .14), 0 4px 12px -4px rgb(13 13 13 / .06);
  --shadow-float: 0 0 0 1px var(--line-1), 0 12px 28px -16px rgb(13 13 13 / .18);
}
.dark {
  color-scheme: dark;
  --bg: #08090a;
  --surface-1: #0d0e10;
  --surface-2: #121316;
  --surface-3: #17181c;
  --fg-1: rgb(255 255 255 / .94);
  --fg-2: rgb(255 255 255 / .66);
  --fg-3: rgb(255 255 255 / .46);
  --fg-4: rgb(255 255 255 / .32);
  --line-1: rgb(255 255 255 / .06);
  --line-2: rgb(255 255 255 / .1);
  --line-3: rgb(255 255 255 / .16);
  --fill-1: rgb(255 255 255 / .03);
  --fill-2: rgb(255 255 255 / .06);
  --fill-3: rgb(255 255 255 / .1);
  --invert: #fcfcfd;
  --invert-fg: #08090a;
  --accent: #4d9fff;
  --accent-strong: #8fbcff;
  --accent-fg: #08090a;
  --accent-soft: rgb(77 159 255 / .16);
  --accent-ring: rgb(77 159 255 / .5);
  --success: #3ecf8e;
  --warning: #f2b54b;
  --danger: #f4646a;
  --success-soft: rgb(62 207 142 / .12);
  --warning-soft: rgb(242 181 75 / .12);
  --danger-soft: rgb(244 100 106 / .12);
  --chart-in: #4d9fff;
  --chart-out: #00ad95;
  --scrim: rgb(0 0 0 / .6);
  --menu-fill: rgb(30 31 35 / .94);
  --shadow-raised: inset 0 1px 0 0 rgb(255 255 255 / .05), 0 0 0 1px var(--line-1), 0 2px 6px -2px rgb(0 0 0 / .5);
  --shadow-overlay: inset 0 1px 0 0 rgb(255 255 255 / .05), 0 0 0 1px var(--line-2), 0 16px 48px -12px rgb(0 0 0 / .7);
  --shadow-float: inset 0 1px 0 0 rgb(255 255 255 / .05), 0 0 0 1px var(--line-1), 0 14px 32px -16px rgb(0 0 0 / .7);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { /* 同 .dark 全量 */ }
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #08090a; --surface-1: #0d0e10; --surface-2: #121316; --surface-3: #17181c;
    --fg-1: rgb(255 255 255 / .94); --fg-2: rgb(255 255 255 / .66); --fg-3: rgb(255 255 255 / .46); --fg-4: rgb(255 255 255 / .32);
    --line-1: rgb(255 255 255 / .06); --line-2: rgb(255 255 255 / .1); --line-3: rgb(255 255 255 / .16);
    --fill-1: rgb(255 255 255 / .03); --fill-2: rgb(255 255 255 / .06); --fill-3: rgb(255 255 255 / .1);
    --invert: #fcfcfd; --invert-fg: #08090a;
    --accent: #4d9fff; --accent-strong: #8fbcff; --accent-fg: #08090a;
    --accent-soft: rgb(77 159 255 / .16); --accent-ring: rgb(77 159 255 / .5);
    --success: #3ecf8e; --warning: #f2b54b; --danger: #f4646a;
    --success-soft: rgb(62 207 142 / .12); --warning-soft: rgb(242 181 75 / .12); --danger-soft: rgb(244 100 106 / .12);
    --chart-in: #4d9fff; --chart-out: #00ad95;
    --scrim: rgb(0 0 0 / .6); --menu-fill: rgb(30 31 35 / .94);
    --shadow-raised: inset 0 1px 0 0 rgb(255 255 255 / .05), 0 0 0 1px var(--line-1), 0 2px 6px -2px rgb(0 0 0 / .5);
    --shadow-overlay: inset 0 1px 0 0 rgb(255 255 255 / .05), 0 0 0 1px var(--line-2), 0 16px 48px -12px rgb(0 0 0 / .7);
    --shadow-float: inset 0 1px 0 0 rgb(255 255 255 / .05), 0 0 0 1px var(--line-1), 0 14px 32px -16px rgb(0 0 0 / .7);
  }
}

/* ---------- 基础 ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-synthesis: none; }
body {
  background: var(--surface-1); color: var(--fg-1);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px; line-height: 24px;
}
button { cursor: pointer; font: inherit; color: inherit; border: none; background: none; }
button:disabled { cursor: not-allowed; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
* { scrollbar-width: thin; scrollbar-color: var(--line-3) transparent; }

/* ---------- 字号刻度 ---------- */
.t-micro { font-size: 11px; line-height: 16px; }
.t-caption { font-size: 12px; line-height: 18px; }
.t-small { font-size: 13px; line-height: 21px; }
.t-body { font-size: 14px; line-height: 24px; }
.t-lead { font-size: 16px; line-height: 28px; }
.t-title { font-size: 20px; line-height: 30px; }
.t-heading { font-size: 24px; line-height: 34px; }
.t-headline { font-size: 36px; line-height: 48px; }
.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "SF Mono", Consolas, "PingFang SC", monospace; }

/* ---------- 动效 ---------- */
@keyframes fade-in { from { opacity: 0; } }
@keyframes pop-in { from { opacity: 0; transform: scale(.97); } }
@keyframes pulse-dot { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
.fade-in { animation: fade-in 180ms cubic-bezier(.22,1,.36,1) both; }
.pop-in { animation: pop-in 200ms cubic-bezier(.22,1,.36,1) both; }
.pulse-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
.spin { animation: spin 900ms linear infinite; }
.press { transition: transform 160ms cubic-bezier(.22,1,.36,1), background-color 120ms, color 120ms, box-shadow 120ms, opacity 120ms; }
.press:active:not(:disabled) { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- 布局外壳: h-dvh + 头 56px + 主区圆角卡 ---------- */
.shell { display: flex; height: 100dvh; flex-direction: column; overflow: hidden; background: var(--surface-1); }
.topbar { display: flex; height: 56px; flex-shrink: 0; align-items: center; gap: 8px; padding: 0 16px; position: relative; }
.brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
/* DingAgentX 标志: 钉钉三色翅膀, 翅尖换成 AI 星光 */
.brand-mark { width: 26px; height: 26px; display: block; }
.navpills { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill-2); }
.navpill { height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--fg-2); white-space: nowrap; }
.navpill:hover { color: var(--fg-1); }
.navpill.on { background: var(--surface-3); color: var(--fg-1); box-shadow: var(--shadow-raised); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.main { position: relative; margin: 0 8px 8px; min-height: 0; flex: 1; overflow: hidden; border-radius: 16px; background: var(--bg); box-shadow: var(--shadow-raised); }
@media (max-width: 959px) { .navpills { position: static; transform: none; order: 5; overflow-x: auto; } .topbar { flex-wrap: wrap; height: auto; padding: 8px 12px; row-gap: 4px; } .navpills { width: 100%; } }

/* ---------- 按钮: 胶囊. 一屏一个主按钮,主按钮反色 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex-shrink: 0; white-space: nowrap; font-weight: 500; border-radius: 999px; user-select: none;
  height: 32px; padding: 0 14px; font-size: 13px; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn svg { width: 16px; height: 16px; }
.btn-sm { height: 28px; padding: 0 12px; font-size: 13px; } .btn-sm svg { width: 14px; height: 14px; }
.btn-icon { width: 32px; height: 32px; padding: 0; } .btn-icon-sm { width: 28px; height: 28px; padding: 0; } .btn-icon-sm svg { width: 14px; height: 14px; }
.btn-primary { background: var(--invert); color: var(--invert-fg); box-shadow: var(--shadow-raised); }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--invert) 90%, transparent); }
.btn-secondary { background: var(--fill-2); color: var(--fg-1); box-shadow: 0 0 0 1px var(--line-2) inset; }
.btn-secondary:hover:not(:disabled) { background: var(--fill-3); }
.btn-ghost { color: var(--fg-2); }
.btn-ghost:hover:not(:disabled) { background: var(--fill-2); color: var(--fg-1); }
.btn-danger { background: var(--danger-soft); color: var(--danger); box-shadow: 0 0 0 1px color-mix(in srgb, var(--danger) 25%, transparent) inset; }
.btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

/* ---------- 状态 ---------- */
.state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.tone-ok { background: var(--success); } .tone-bad { background: var(--danger); } .tone-idle { background: var(--fg-4); }
.tone-busy { background: var(--warning); animation: pulse-dot 1.6s ease-in-out infinite; }
.state-badge { display: inline-flex; height: 24px; align-items: center; gap: 6px; border-radius: 999px; padding: 0 10px; font-size: 12px; line-height: 18px; font-weight: 500; }
.sb-ok { background: var(--success-soft); color: var(--success); }
.sb-busy { background: var(--warning-soft); color: var(--warning); }
.sb-bad { background: var(--danger-soft); color: var(--danger); }
.sb-idle { background: var(--fill-2); color: var(--fg-2); }
.tag { display: inline-flex; height: 20px; align-items: center; border-radius: 999px; background: var(--fill-2); padding: 0 8px; font-size: 11px; line-height: 16px; font-weight: 500; color: var(--fg-2); max-width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 头像: 首字母中性底 / 真头像 (img 覆盖) ---------- */
.avatar { position: relative; display: inline-grid; flex-shrink: 0; place-items: center; overflow: hidden; border-radius: 999px; background: var(--fill-3); font-weight: 500; color: var(--fg-2); }
.av-sm { width: 28px; height: 28px; font-size: 12px; line-height: 18px; }
.av-md { width: 32px; height: 32px; font-size: 13px; line-height: 21px; }
.av-lg { width: 40px; height: 40px; font-size: 14px; line-height: 24px; }
.av-xl { width: 56px; height: 56px; font-size: 20px; line-height: 30px; }
img.avatar { object-fit: cover; display: block; background: var(--fill-3); }

:root { --logo-head: #133c9a; }
html.dark, :root[data-theme="dark"] { --logo-head: #8fb0ff; }

/* ---------- 首页动效 ---------- */
.blur-in { animation: blur-in 420ms var(--motion-ease, cubic-bezier(.22,1,.36,1)) both; animation-delay: var(--delay, 40ms); }
@keyframes blur-in { from { opacity: 0; transform: translateY(-6px); filter: blur(6px); } }
.rise { animation: rise 380ms var(--motion-ease, cubic-bezier(.22,1,.36,1)) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); filter: blur(2px); } }
.dot-field, .dot-field-lamp { position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(currentColor 1px, transparent 1.2px); background-size: 22px 22px; background-position: 11px 11px; }
.dot-field { color: var(--fg-4); opacity: .55; -webkit-mask-image: linear-gradient(to bottom, black 55%, transparent 96%); mask-image: linear-gradient(to bottom, black 55%, transparent 96%); }
.dot-field-lamp { color: var(--fg-2); -webkit-mask-image: radial-gradient(360px circle at var(--x, 86%) var(--y, 14%), black, transparent 70%); mask-image: radial-gradient(360px circle at var(--x, 86%) var(--y, 14%), black, transparent 70%); }
.marquee { -webkit-mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent); mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent); }
.marquee-track { display: flex; gap: 12px; width: max-content; animation: marquee 70s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(calc(-50% - 6px)); } }
.header-float { background-color: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(10px); }
.glass { background-color: var(--glass-fill, color-mix(in srgb, var(--bg) 65%, transparent)); backdrop-filter: blur(10px); box-shadow: var(--shadow-raised); }
.terminal-caret { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: currentColor; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.progress-line { animation: progress-line var(--duration, 8s) linear both; transform-origin: left; }
@keyframes progress-line { from { transform: scaleX(0); } }
.spin { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.font-serif { font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, Georgia, serif; }
@media (prefers-reduced-motion: reduce) {
  .blur-in, .rise, .marquee-track, .terminal-caret, .progress-line { animation: none; }
}
/* ---------- 人员选择框: 按名字搜索 + token chips ---------- */
.people-box { display: flex; min-height: 38px; flex-wrap: wrap; align-items: center; gap: 6px; border-radius: 8px; background: var(--fill-2); padding: 4px 8px; }
.people-box:focus-within { background: transparent; box-shadow: 0 0 0 1px var(--accent-ring) inset; }
.people-chip { display: inline-flex; height: 24px; align-items: center; gap: 4px; border-radius: 999px; background: var(--surface-3); padding-left: 2px; padding-right: 4px; font-size: 12px; line-height: 18px; box-shadow: var(--shadow-raised); }
.people-chip button { display: grid; place-items: center; width: 16px; height: 16px; border: none; border-radius: 999px; background: transparent; color: var(--fg-3); cursor: pointer; padding: 0; }
.people-chip button:hover { background: var(--fill-3); color: var(--fg-1); }
.people-input { flex: 1; min-width: 96px; height: 24px; border: none; outline: none; background: transparent; font-size: 13px; color: var(--fg-1); }
.people-input::placeholder { color: var(--fg-4); }
.people-drop { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 4px; max-height: 256px; overflow-y: auto; border-radius: 10px; background: var(--menu-fill); backdrop-filter: blur(16px) saturate(1.5); box-shadow: var(--shadow-overlay); padding: 4px; }
.people-opt { display: flex; width: 100%; align-items: center; gap: 10px; border: none; background: transparent; border-radius: 8px; padding: 6px 8px; text-align: left; font-size: 13px; cursor: pointer; }
.people-opt:hover { background: var(--fill-2); }

/* ---------- 首页组件 ---------- */
.home-wrap { min-height: 100%; background: var(--bg); }
.home-hero { position: relative; isolation: isolate; overflow: hidden; }
.story-card { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; border-radius: 12px; background: var(--surface-1, var(--surface-3)); padding: 16px; user-select: none; }
.home-demo { width: 100%; min-width: 300px; flex: 1.2; overflow: hidden; border-radius: 14px; background: var(--surface-3); box-shadow: var(--shadow-raised); }
.home-demo-head { display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--line-1); padding: 8px 16px; font-size: 14px; }
.home-demo-head b { font-weight: 500; }
.home-demo-body { display: flex; flex-direction: column; gap: 12px; min-height: 320px; background: color-mix(in srgb, var(--bg) 50%, transparent); padding: 20px; }
.term-card { overflow: hidden; border-radius: 14px; background: #0d0e10; color: #f4f5f7; box-shadow: var(--shadow-raised); flex: 1.2; min-width: 300px; }
.term-head { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; }
.term-head i { width: 10px; height: 10px; border-radius: 999px; background: rgb(244 245 247 / .15); }
.term-copy { margin-left: auto; cursor: pointer; border: none; border-radius: 999px; padding: 2px 8px; font-size: 12px; background: transparent; color: rgb(244 245 247 / .6); }
.term-copy:hover { color: #f4f5f7; background: rgb(244 245 247 / .1); }
.term-body { min-height: 176px; padding: 0 20px 20px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 28px; }

/* ---------- 卡片 / 表单 ---------- */
.card { border-radius: 16px; background: var(--surface-3); box-shadow: var(--shadow-raised); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; line-height: 21px; font-weight: 500; color: var(--fg-1); }
.field .hint { font-size: 12px; line-height: 18px; color: var(--fg-3); }
.input { width: 100%; height: 36px; border-radius: 8px; background: var(--fill-2); padding: 0 12px; font-size: 14px; line-height: 24px; color: var(--fg-1); border: none; outline: none; box-shadow: 0 0 0 1px transparent inset; transition: box-shadow 120ms, background 120ms; }
.input::placeholder { color: var(--fg-4); }
.input:focus { background: transparent; box-shadow: 0 0 0 1px var(--accent-ring) inset; }
.input:disabled { opacity: .5; }
.textarea { width: 100%; min-height: 88px; resize: vertical; border-radius: 8px; background: var(--fill-2); padding: 8px 12px; font: inherit; font-size: 14px; color: var(--fg-1); border: none; outline: none; box-shadow: 0 0 0 1px transparent inset; }
.textarea:focus { background: transparent; box-shadow: 0 0 0 1px var(--accent-ring) inset; }

/* 开关行 */
.switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; border-radius: 999px; background: var(--fill-3); transition: background 150ms; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: var(--surface-3); box-shadow: var(--shadow-raised); transition: transform 150ms cubic-bezier(.22,1,.36,1); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); }
.switchrow { display: flex; align-items: center; gap: 16px; padding: 12px 0; }
.switchrow .body { min-width: 0; flex: 1; }
.switchrow .title { font-size: 14px; line-height: 24px; font-weight: 500; }
.switchrow .sub { font-size: 12px; line-height: 18px; color: var(--fg-3); }

/* ---------- 弹窗 ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); backdrop-filter: blur(2px); }
.dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 50; width: calc(100% - 32px); max-width: 448px; max-height: 92dvh; overflow-y: auto; border-radius: 12px; background: var(--surface-3); padding: 24px; box-shadow: var(--shadow-overlay); }
.dialog h2 { font-size: 20px; line-height: 30px; font-weight: 500; }

/* ---------- 提示条 ---------- */
.toasts { position: fixed; left: 0; right: 0; bottom: 20px; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }
.toast { max-width: 448px; border-radius: 999px; padding: 8px 16px; font-size: 13px; line-height: 21px; box-shadow: var(--shadow-overlay); background: var(--invert); color: var(--invert-fg); }
.toast.err { background: var(--danger); color: #fff; }

/* ---------- 空状态 ---------- */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 56px 24px; text-align: center; }
.empty .icon { margin-bottom: 4px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; background: var(--fill-2); color: var(--fg-3); }
.empty .icon svg { width: 20px; height: 20px; }
.empty h3 { font-size: 16px; line-height: 28px; font-weight: 500; }
.empty p { max-width: 384px; font-size: 13px; line-height: 21px; color: var(--fg-3); }

/* ---------- 滚动区 ---------- */
.page-scroll { overflow-y: auto; scrollbar-gutter: stable; position: relative; }

/* ============================================================
   页面级
   ============================================================ */
.center-wrap { display: grid; height: 100%; place-items: center; padding: 24px; }
.entry-hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
.entry-hero h1 { font-size: 36px; line-height: 48px; font-weight: 400; }
.entry-hero h1 .dim { color: var(--fg-3); }
.entry-hero p { margin: 8px 0 24px; font-size: 13px; line-height: 21px; color: var(--fg-3); }

/* 扫码面板: 232px 白卡 + 像素渲染 + 扫过绿勾 */
.login-panel { margin: 0 auto; display: flex; width: 100%; max-width: 340px; flex-direction: column; align-items: center; }
.qr-box { position: relative; margin-top: 16px; width: 232px; height: 232px; display: grid; place-items: center; overflow: hidden; border-radius: 16px; background: #fff; box-shadow: var(--shadow-raised); }
.qr-box img { width: 100%; height: 100%; padding: 8px; image-rendering: pixelated; }
.qr-box img.scanned { opacity: .1; }
.qr-pulse { width: 100%; height: 100%; background: var(--fill-1); animation: pulse-dot 1.6s ease-in-out infinite; }
.qr-check { position: absolute; inset: 0; display: grid; place-items: center; }
.qr-check span { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; background: var(--success); color: #fff; }
.qr-check svg { width: 24px; height: 24px; }
.login-msg { margin-top: 12px; min-height: 24px; font-size: 13px; line-height: 21px; color: var(--fg-2); }

/* 概览 */
.ov-wrap { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 960px; margin: 0 auto; padding: 32px 24px 96px; }
.ov-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.ov-name { min-width: 0; flex: 1; }
.ov-name h1 { font-size: 20px; line-height: 30px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-name .sub { font-size: 13px; line-height: 21px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.err-banner { display: flex; align-items: flex-start; gap: 10px; border-radius: 12px; background: var(--danger-soft); padding: 12px 16px; font-size: 13px; line-height: 21px; color: var(--danger); }
.err-banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
.stat-grid > div { padding: 16px 20px; }
.stat-grid > div + div { border-top: 1px solid var(--line-1); }
.stat-num { font-size: 24px; line-height: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 12px; line-height: 18px; color: var(--fg-3); }
@media (min-width: 768px) {
  .stat-grid { grid-template-columns: repeat(4, 1fr); }
  .stat-grid > div + div { border-top: none; }
  .stat-grid > div:nth-child(n+2) { border-left: 1px solid var(--line-1); }
}

/* 近 7 天: 分组柱形 (dataviz 规范: 发丝网格/顶部圆角/悬停提示/读屏表) */
.wk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 16px 20px 0; }
.wk-legend { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--fg-2); }
.wk-legend i { width: 8px; height: 8px; border-radius: 2px; }
.wk-legend b { font-weight: 500; color: var(--fg-1); font-variant-numeric: tabular-nums; }
.wk-plot { position: relative; margin: 12px 20px 12px 48px; height: 136px; }
.wk-grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line-1); }
.wk-grid span { position: absolute; top: -8px; left: -28px; width: 20px; text-align: right; font-size: 11px; line-height: 16px; color: var(--fg-4); font-variant-numeric: tabular-nums; }
.wk-cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.wk-col { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.wk-col:hover { background: var(--fill-1); }
.wk-col i { display: block; width: 100%; max-width: 20px; border-radius: 4px 4px 0 0; }
.wk-col .ci { background: var(--chart-in); } .wk-col .co { background: var(--chart-out); }
.wk-tip { position: absolute; bottom: 100%; z-index: 10; margin-bottom: 4px; border-radius: 8px; background: var(--invert); color: var(--invert-fg); padding: 4px 8px; font-size: 12px; line-height: 18px; white-space: nowrap; }
.wk-days { display: grid; grid-template-columns: repeat(7, 1fr); margin: 6px 20px 12px 48px; }
.wk-days span { text-align: center; font-size: 11px; line-height: 16px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.wk-empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; line-height: 18px; color: var(--fg-3); }

/* 最近消息 */
.recent-head-link { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 13px; line-height: 21px; color: var(--fg-3); }
.recent-head-link:hover { color: var(--fg-1); }
.recent-list { padding-bottom: 8px; }.recent-row { display: flex; width: 100%; align-items: center; gap: 12px; padding: 8px 20px; text-align: left; }
.recent-row:hover { background: var(--fill-1); }
.recent-row .who { width: 112px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 21px; font-weight: 500; }
.recent-row .txt { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 21px; color: var(--fg-2); }
.recent-row .when { width: 80px; flex-shrink: 0; text-align: right; font-size: 12px; line-height: 18px; color: var(--fg-3); font-variant-numeric: tabular-nums; }

/* 聊天: 300px 侧栏 + 线程 */
.chats-grid { display: grid; height: 100%; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(120px,36%) minmax(0,1fr); }
@media (min-width: 821px) { .chats-grid { grid-template-columns: 300px minmax(0,1fr); grid-template-rows: minmax(0,1fr); } }
.chat-side { display: flex; min-height: 0; flex-direction: column; border-bottom: 1px solid var(--line-1); background: color-mix(in srgb, var(--surface-1) 40%, transparent); }
@media (min-width: 821px) { .chat-side { border-bottom: none; border-right: 1px solid var(--line-1); } }
.chat-search { position: relative; flex-shrink: 0; padding: 12px; }
.chat-search svg { position: absolute; top: 50%; left: 24px; width: 14px; height: 14px; transform: translateY(-50%); color: var(--fg-4); pointer-events: none; }
.chat-search input { width: 100%; height: 32px; border-radius: 999px; background: var(--fill-2); padding: 0 12px 0 32px; font-size: 13px; color: var(--fg-1); border: none; outline: none; box-shadow: 0 0 0 1px transparent inset; }
.chat-search input:focus { box-shadow: 0 0 0 1px var(--accent-ring) inset; }
.chat-search input::placeholder { color: var(--fg-4); }
.chat-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
.chat-item { display: flex; gap: 10px; border-radius: 8px; padding: 8px 10px; color: var(--fg-1); align-items: center; }
.chat-item:hover { background: var(--fill-2); }
.chat-item.on { background: var(--fill-3); }
.chat-item .meta { min-width: 0; flex: 1; }
.chat-item .r1 { display: flex; align-items: baseline; gap: 8px; }
.chat-item .name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 21px; font-weight: 500; }
.chat-item .time { flex-shrink: 0; font-size: 11px; line-height: 16px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.chat-item .r2 { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 18px; color: var(--fg-3); }

/* 线程 */
.thread { display: flex; min-height: 0; min-width: 0; flex-direction: column; }
.thread-head { display: flex; min-height: 56px; flex-shrink: 0; align-items: center; gap: 10px; border-bottom: 1px solid var(--line-1); padding: 8px 16px; }
.thread-head h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 24px; font-weight: 500; }
.thread-box { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
.thread-inner { margin: 0 auto; width: 100%; max-width: 760px; }
.day-chip { margin: 16px 0; text-align: center; }
.day-chip span { border-radius: 999px; background: var(--fill-2); padding: 2px 10px; font-size: 12px; line-height: 18px; color: var(--fg-3); }
.msg-row { display: flex; gap: 10px; margin-top: 16px; }
.msg-row.grouped { margin-top: 4px; }
.msg-row.out { flex-direction: row-reverse; }
.msg-col { display: flex; max-width: 78%; min-width: 0; flex-direction: column; }
.msg-row.out .msg-col { align-items: flex-end; }
.msg-sender { margin-bottom: 4px; font-size: 12px; line-height: 18px; color: var(--fg-3); }
.msg-spacer { width: 28px; flex-shrink: 0; }
.bubble { border-radius: 12px; padding: 8px 12px; font-size: 14px; line-height: 24px; overflow-wrap: break-word; white-space: pre-wrap; }
.bubble.in { background: var(--fill-2); }
.bubble.out { background: var(--accent-soft); }
.bubble.media { color: var(--fg-3); font-style: italic; }
.composer { flex-shrink: 0; border-top: 1px solid var(--line-1); padding: 12px; }
.composer-inner { margin: 0 auto; display: flex; width: 100%; max-width: 760px; align-items: flex-end; gap: 8px; border-radius: 12px; background: var(--fill-2); padding: 6px; box-shadow: 0 0 0 1px transparent inset; }
.composer-inner:focus-within { background: transparent; box-shadow: 0 0 0 1px var(--accent-ring) inset; }
.composer textarea { max-height: 128px; min-height: 32px; flex: 1; resize: none; background: transparent; padding: 4px 8px; font: inherit; font-size: 14px; line-height: 24px; color: var(--fg-1); border: none; outline: none; }
.composer textarea::placeholder { color: var(--fg-4); }

/* 设置 */
.set-grid { display: grid; width: 100%; max-width: 960px; gap: 32px; margin: 0 auto; padding: 32px 24px 96px; }
@media (min-width: 768px) { .set-grid { grid-template-columns: 160px minmax(0,1fr); } }
.set-nav { display: flex; gap: 4px; overflow-x: auto; }
@media (min-width: 768px) { .set-nav { position: sticky; top: 32px; flex-direction: column; align-self: start; } }
.set-nav button { height: 32px; flex-shrink: 0; border-radius: 999px; padding: 0 12px; text-align: left; font-size: 13px; line-height: 21px; color: var(--fg-3); }
.set-nav button:hover { color: var(--fg-1); }
.set-nav button.on { background: var(--fill-2); font-weight: 500; color: var(--fg-1); }
.set-section { scroll-margin-top: 24px; }
.set-section + .set-section { margin-top: 32px; }
.set-section h2 { font-size: 16px; line-height: 28px; font-weight: 500; }
.set-section .note { margin-bottom: 12px; font-size: 13px; line-height: 21px; color: var(--fg-3); }
.set-card { border-radius: 16px; background: var(--surface-3); box-shadow: var(--shadow-raised); padding: 20px; }
.rule-row { display: flex; gap: 8px; align-items: center; }
.rule-row .input { flex: 1; min-width: 0; }
.rule-row .arrow { color: var(--fg-4); flex-shrink: 0; }
.rule-rows { display: flex; flex-direction: column; gap: 8px; }

/* 日志 */
.logs-wrap { display: flex; height: 100%; width: 100%; max-width: 960px; flex-direction: column; margin: 0 auto; padding: 32px 24px; gap: 16px; }
.log-card { min-height: 0; flex: 1; overflow: hidden; border-radius: 16px; background: var(--surface-3); box-shadow: var(--shadow-raised); }
.log-box { height: 100%; overflow-y: auto; padding: 16px; font-family: ui-monospace, "SF Mono", Consolas, "PingFang SC", monospace; font-size: 12px; line-height: 18px; }
.log-line { overflow-wrap: break-word; white-space: pre-wrap; }
.log-line .t { margin-right: 12px; color: var(--fg-4); font-variant-numeric: tabular-nums; }
.log-line.warn { color: var(--warning); } .log-line.error { color: var(--danger); }

/* 账号卡片 (全部账号页) */
.acc-grid { display: grid; gap: 12px; }
@media (min-width: 640px) { .acc-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .acc-grid { grid-template-columns: repeat(3, 1fr); } }
.acc-card { display: flex; flex-direction: column; }
.acc-top { display: flex; align-items: center; gap: 12px; padding: 16px; text-align: left; width: 100%; }
.acc-bottom { margin-top: auto; display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line-1); padding: 10px 16px; }

/* 账号菜单 */
.menu-anchor { position: relative; }
.menu-btn { display: flex; height: 36px; min-width: 0; align-items: center; gap: 8px; border-radius: 999px; padding: 4px 8px 4px 4px; }
.menu-btn:hover, .menu-btn.open { background: var(--fill-2); }
.menu-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; min-width: 260px; white-space: nowrap; border-radius: 12px; background: var(--menu-fill); backdrop-filter: blur(16px) saturate(1.5); box-shadow: var(--shadow-overlay); padding: 4px; }
.menu-item { display: flex; min-height: 36px; align-items: center; gap: 10px; border-radius: 8px; padding: 4px 8px; font-size: 13px; line-height: 21px; width: 100%; text-align: left; }
.menu-item:hover { background: var(--fill-2); }
.menu-item .flex1 { min-width: 0; flex: 1; }
.menu-sep { margin: 4px 0; height: 1px; background: var(--line-1); }
</style>

<body>
<div class="shell" id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   DingAgentX 控制台:
   hash 路由 #/accounts | #/a/<id>/<tab>[/chat] + 轮询 + 语义令牌 UI.
   ============================================================ */
'use strict';

/* ---------- API ---------- */
const enc = encodeURIComponent;
async function api(method, path, body) {
  const r = await fetch('/api' + path, {
    method,
    headers: body !== undefined ? { 'content-type': 'application/json' } : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { throw new Error(r.ok ? '响应解析失败' : `${r.status}`); }
  if (!r.ok) throw new Error((data && data.error) || `${r.status} ${method} ${path}`);
  return data;
}

/* ---------- 全局状态 ---------- */
const S = {
  meta: null, accounts: [], runtimes: [], loaded: false, error: '',
  theme: new URLSearchParams(location.search).get('theme') || localStorage.getItem('dx-theme') || '',
};
function applyTheme() {
  if (S.theme === 'dark') document.documentElement.classList.add('dark'), document.documentElement.setAttribute('data-theme','dark');
  else if (S.theme === 'light') document.documentElement.setAttribute('data-theme','light');
  else { document.documentElement.classList.remove('dark'); document.documentElement.removeAttribute('data-theme'); }
}
applyTheme();
function toggleTheme() {
  const sys = matchMedia('(prefers-color-scheme: dark)').matches;
  const nowDark = S.theme ? S.theme === 'dark' : sys;
  S.theme = nowDark ? 'light' : 'dark';
  localStorage.setItem('dx-theme', S.theme);
  applyTheme();
  render();
}

/* ---------- 图标 (lucide 内联子集) ---------- */
const ICON = {
  plus: 'M5 12h14M12 5v14',
  users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 1 0 8 4 4 0 0 1 0-8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
  chev: 'm6 9 6 6 6-6',
  play: 'M6.7 4.8a1 1 0 0 1 1.5.9v12.6a1 1 0 0 1-1.5.9L19 12.6a1 1 0 0 1 0-1.7ZM6 5v14',
  square: 'M5 5h14v14H5z',
  rotate: 'M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6',
  trash: 'M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6',
  check: 'M20 6 9 17l-5-5',
  refresh: 'M3 12a9 9 0 0 1 15.5-6.4L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.4L3 16M3 21v-5h5',
  search: 'm21 21-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16',
  send: 'm22 2-7 20-4-9-9-4ZM22 2 11 13',
  msgs: 'M7.9 20A9 9 0 1 0 4 16.1L2 22Z',
  alert: 'M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0',
  moon: 'M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8',
  sun: 'M12 4V2m0 20v-2M4.9 4.9 3.5 3.5m17 17-1.4-1.4M4 12H2m20 0h-2M4.9 19.1 3.5 20.5m17-17-1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',
  arrowR: 'M5 12h14m-7-7 7 7-7 7',
  x: 'M18 6 6 18M6 6l12 12',
  chat: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
};
function icon(name, cls) {
  return `<svg class="${cls || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[name]}"/></svg>`;
}

/* ---------- Logo: 钉钉蓝翅膀 + AI 星光 ---------- */
function Mark(size) {
  size = size || 26;
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true" class="brand-mark">
    <path fill="#3370ff" d="M5 24C12 31.2 20 36.6 28.5 40.5 36 44 44.3 43.8 50.8 39.2 46.6 49.6 36.6 56.5 25.5 56.5 14.2 56.5 5 48.8 5 38.8Z"/>
    <path style="fill:var(--logo-head,#133c9a)" d="M28.5 40.5C33.2 36.6 38 30.8 43 27.6 47.2 25 52.4 23.9 59.6 24.4 56.6 27 54.1 31.6 51.6 36 46.8 44.6 36.8 46.4 28.5 40.5Z"/>
    <path fill="#00d6b9" d="M28.5 3C30.12 15.35 31.58 17.08 42 19 31.58 20.92 30.12 22.65 28.5 35 26.88 22.65 25.42 20.92 15 19 25.42 17.08 26.88 15.35 28.5 3Z"/>
  </svg>`;
}

/* ---------- 状态 ---------- */
const STATE = {
  no_login: ['未登录', 'idle'], stopped: ['已停止', 'idle'], idle: ['已停止', 'idle'],
  login_flow: ['登录中', 'busy'], starting: ['启动中', 'busy'], connecting: ['连接中', 'busy'],
  reconnecting: ['重连中', 'busy'], running: ['运行中', 'ok'], error: ['出错', 'bad'],
};
const stateLabel = (s) => (STATE[s] || [s, 'idle'])[0];
const stateTone = (s) => (STATE[s] || [null, 'idle'])[1];
const isActive = (s) => ['starting', 'connecting', 'running', 'reconnecting'].includes(s);
const stateDot = (s) => `<span class="state-dot tone-${stateTone(s)}" aria-hidden="true"></span>`;
const stateBadge = (s) => `<span class="state-badge sb-${stateTone(s)}">${stateDot(s)}${stateLabel(s)}</span>`;

/* ---------- 头像 ---------- */
function avatarImg(name, size, uid, account) {
  const c = (name || '?').trim().codePointAt(0);
  const ch = c ? String.fromCodePoint(c).toUpperCase() : '?';
  if (uid && account) {
    const url = `/api/accounts/${enc(account)}/avatars/user/${enc(String(uid))}`;
    return `<img class="avatar av-${size}" src="${url}" alt="${X(name || '')}" loading="lazy" data-fb="${X(ch)}">`;
  }
  return `<span class="avatar av-${size}">${X(ch)}</span>`;
}
/* 全局兜底: 404 → 首字母 (头像代理返回 404 时降级) */
document.addEventListener('error', (e) => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.classList.contains('avatar') && t.dataset.fb) {
    t.replaceWith(Object.assign(document.createElement('span'),
      { className: t.className.replace('av-img', ''), textContent: t.dataset.fb }));
  }
}, true);
function avatar(name, size) {
  const c = (name || '?').trim().codePointAt(0);
  const ch = c ? String.fromCodePoint(c).toUpperCase() : '?';
  return `<span class="avatar av-${size}">${X(ch)}</span>`;
}

/* ---------- Toast ---------- */
function toast(text, err) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast pop-in' + (err ? ' err' : '');
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 2600);
}
async function attempt(fn) {
  try { return await fn(); } catch (e) { toast(e.message || '操作失败', true); }
}

/* ---------- 时间 ---------- */
const pad = (n) => String(n).padStart(2, '0');
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000), now = new Date();
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return '昨天 ' + hm;
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm}`;
}
function fmtDay(ts) {
  const d = new Date(ts * 1000), now = new Date();
  if (d.toDateString() === now.toDateString()) return '今天';
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return '昨天';
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* ---------- 路由 ---------- */
const TABS = [['overview', '概览'], ['chats', '聊天记录'], ['memory', '记忆'], ['settings', '设置'], ['logs', '日志']];
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  let m = h.match(/^\/a\/([^/]+)\/(\w+)(?:\/(.+))?/);
  if (m) {
    const tab = TABS.some((t) => t[0] === m[2]) ? m[2] : 'overview';
    return { view: 'account', id: decodeURIComponent(m[1]), tab, chat: m[3] ? decodeURIComponent(m[3]) : '' };
  }
  if (h === '/accounts') return { view: 'accounts', id: '', tab: 'overview', chat: '' };

   扫码登录
   ============================================================ */
function loginPanelHTML(snap, failed) {
  const qr = snap && snap.qr
    ? `<img src="${snap.qr}" alt="登录二维码" class="${snap.state === 'scanned' ? 'scanned' : ''}">`
    : '<div class="qr-pulse"></div>';
  const check = snap && snap.state === 'scanned' ? `<div class="qr-check"><span>${icon('check')}</span></div>` : '';
  const msg = snap ? (snap.state === 'failed' ? snap.message : snap.state === 'scanned' ? snap.message : '请使用钉钉 App 的「扫一扫」') : '正在获取二维码…';
  return `
    <div class="login-panel">
      <div class="qr-box">${qr}${check}</div>
      <p class="login-msg">${X(msg)}</p>
      ${failed ? btn(icon('refresh') + '重新获取', 'secondary', 'sm', '', 'data-login-retry') : ''}
    </div>`;
}

function mountLogin(container, onDone) {
  let dead = false, timer = 0, done = false, key = '';
  const el = () => container;
  const start = async () => {
    el().innerHTML = loginPanelHTML(null);
    try {
      const first = await api('POST', '/accounts/add');
      key = first.account_id;
      tick();
    } catch (e) {
      if (!dead) { el().innerHTML = loginPanelHTML({ state: 'failed', message: e.message }, true); bindRetry(); }
    }
  };
  const bindRetry = () => { const b = el().querySelector('[data-login-retry]'); if (b) b.onclick = () => { el().innerHTML = loginPanelHTML(null); start(); }; };
  const tick = async () => {
    if (dead) return;
    try {
      const s = await api('GET', `/accounts/${enc(key)}/login/status`);
      if (dead) return;
      el().innerHTML = loginPanelHTML(s, s.state === 'failed');
      bindRetry();
      if (s.state === 'success') { done = true; onDone(s.account_id); return; }
      if (s.state !== 'failed' && s.state !== 'cancelled') timer = setTimeout(tick, 1500);
      else if (s.state === 'cancelled') { /* flow gone */ }
    } catch (e) {
      // pending key 失效 (服务重启): 重新发起
      if (!dead) { el().innerHTML = loginPanelHTML(null); start(); return; }
    }
  };
  start();
  return () => {
    dead = true; clearTimeout(timer);
    if (!done && key) api('DELETE', `/accounts/${enc(key)}/login`).catch(() => {});
  };
}

let dialogStack = [];
function openDialog(title, bodyHTML, opts) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="scrim fade-in"></div>
    <div class="dialog pop-in" role="dialog" aria-label="${X(title)}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
        <h2>${X(title)}</h2>
        ${btn(icon('x'), 'ghost', 'icon-sm', '', 'aria-label="关闭"')}
      </div>
      <div class="dialog-body" style="margin-top:16px"></div>
    </div>`;
  document.body.appendChild(wrap);
  const close = () => { if (wrap.parentNode) wrap.remove(); const i = dialogStack.indexOf(close); if (i >= 0) dialogStack.splice(i, 1); opts && opts.onClose && opts.onClose(); };
  wrap.querySelector('.btn').onclick = close;
  wrap.querySelector('.scrim').onclick = close;
  wrap.querySelector('.dialog-body').innerHTML = bodyHTML;
  dialogStack.push(close);
  if (opts && opts.onMount) opts.onMount(wrap, close);
  return close;
}
function openAddDialog() {
  let cancel = null;
  const close = openDialog('添加账号', '', {
    onMount(root, closefn) {
      cancel = mountLogin(root.querySelector('.dialog-body'), async (id) => {
        closefn(); await refresh(); toast('登录成功'); nav(`/a/${enc(id)}/overview`);
      });
    },
    onClose() { if (cancel) cancel(); },
  });
}

      root.querySelectorAll('.dialog .btn')[0];
      const btns = root.querySelectorAll('.dialog-body .btn');
      btns[0].onclick = close;
      btns[1].onclick = async () => { close(); await onOk(); };
    },
  });
}

const HOME_CMDS = ['git clone https://github.com/cv-cat/DingtalkAgentX', 'cd DingtalkAgentX && pip install -r requirements.txt', 'python -m dingtalkx.web --port 8770'];
function mountHome() {
  // 鼠标跟随灯 (dot-field-lamp)
  const hero = document.querySelector('.home-hero');
  const lamp = document.getElementById('home-lamp');
  if (hero && lamp && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    hero.onpointermove = (e) => {
      const r = hero.getBoundingClientRect();
      lamp.style.setProperty('--x', `${e.clientX - r.left}px`);
      lamp.style.setProperty('--y', `${e.clientY - r.top}px`);
    };
  }
  // 终端打字机
  const term = document.getElementById('home-term');
  if (term) {
    let line = 0, chars = 0, stop = false;
    pageCleanup.push(() => { stop = true; });
    const tick = () => {
      if (stop) return;
      if (line >= HOME_CMDS.length) {
        term.insertAdjacentHTML('beforeend', `<div class="rise" style="color:#3ecf8e">✓ DingAgentX: http://127.0.0.1:8770<span class="terminal-caret" style="margin-left:8px"></span></div>`);
        return;
      }
      const c = HOME_CMDS[line];
      let html = term.dataset.lines || '';
      const done = line < (term.dataset.n | 0);
      if (!term.dataset.built) {
        term.innerHTML = HOME_CMDS.map((x, i) => `<div data-l="${i}"><span style="opacity:.4">$ </span><span class="tx"></span><span class="caret-slot"></span></div>`).join('');
        term.dataset.built = '1';
      }
      const rows = term.querySelectorAll('[data-l]');
      const cur = rows[line] && rows[line].querySelector('.tx');
      if (cur) {
        chars = Math.min(chars + 2, c.length);
        cur.textContent = c.slice(0, chars);
        if (chars >= c.length) {
          rows[line].querySelector('.caret-slot').outerHTML = '';
          line++; chars = 0;
          if (line >= HOME_CMDS.length) { term.insertAdjacentHTML('beforeend', `<div class="rise" style="color:#3ecf8e">✓ DingAgentX: http://127.0.0.1:8770<span class="terminal-caret" style="margin-left:8px"></span></div>`); return; }
        }
      }
      setTimeout(tick, 22);
    };
    tick();
  }
  const copy = document.getElementById('home-copy');
  if (copy) copy.onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(HOME_CMDS.join('\n'));
    copy.textContent = '已复制';
    setTimeout(() => { copy.textContent = '复制'; }, 1500);
  };
  document.querySelectorAll('[data-nav-home]').forEach((el) => el.onclick = () => {
    const to = el.dataset.navHome;
    if (to === '__gh') { window.open('https://github.com/cv-cat/DingAgentX', '_blank'); return; }
    nav(to);
  });
}

/* ============================================================

   ============================================================ */
function weekChart(days) {
  const peak = Math.max(1, ...days.flatMap((d) => [d.in, d.out]));
  const step = peak <= 4 ? 1 : peak <= 20 ? 5 : peak <= 100 ? 25 : 10 ** Math.floor(Math.log10(peak));
  const top = Math.ceil(peak / step) * step;
  const ticks = top % 2 === 0 ? [top, top / 2, 0] : [top, 0];
  const empty = days.every((d) => !d.in && !d.out);
  const H = 136;
  const total = days.reduce((n, d) => ({ in: n.in + d.in, out: n.out + d.out }), { in: 0, out: 0 });
  const cols = days.map((d, i) => `
    <div class="wk-col" data-tip="${X(d.date)} · 收到 ${d.in} · 发出 ${d.out}" data-i="${i}">
      <i class="ci" style="height:${d.in ? Math.max(2, (d.in / top) * H) : 0}px"></i>
      <i class="co" style="height:${d.out ? Math.max(2, (d.out / top) * H) : 0}px"></i>
    </div>`).join('');
  return `<div class="card">
    <div class="wk-head">
      <h2 style="flex:1;font-size:14px;line-height:24px;font-weight:500">近 7 天消息</h2>
      <span class="wk-legend"><i style="background:var(--chart-in)"></i>收到 <b>${total.in}</b></span>
      <span class="wk-legend"><i style="background:var(--chart-out)"></i>发出 <b>${total.out}</b></span>
    </div>
    <div class="wk-plot">
      ${ticks.map((t) => `<div class="wk-grid" style="top:${H - (t / top) * H}px"><span>${t}</span></div>`).join('')}
      ${empty ? '<div class="wk-empty">近 7 天没有消息</div>' : ''}
      <div class="wk-cols">${cols}</div>
    </div>
    <div class="wk-days">${days.map((d) => `<span>${X(d.date)}</span>`).join('')}</div>
    <table style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"><caption>近 7 天每天收到和发出的消息数</caption>
      <thead><tr><th>日期</th><th>收到</th><th>发出</th></tr></thead>
      <tbody>${days.map((d) => `<tr><td>${X(d.date)}</td><td>${d.in}</td><td>${d.out}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

async function mountChats(a, chatId) {
  const list = document.getElementById('chat-list');
  const qEl = document.getElementById('chat-q');
  let chats = [];
  let searchMode = null;   // {chats: [], messages: []} 服务器搜索结果
  const loadList = async () => {
    try { chats = await api('GET', `/accounts/${enc(a.id)}/chats`); } catch { return; }
    drawList(qEl.value);
  };
  const runSearch = async (q) => {
    // 服务器侧搜索: 消息流水全文 + 会话标题; 失败回退本地过滤
    try {
      searchMode = await api('GET', `/accounts/${enc(a.id)}/search?q=${enc(q)}`);
    } catch { searchMode = null; }
    drawList(q);
  };
  const drawList = (q) => {
    const s = (q || '').trim().toLowerCase();
    if (!s) {
      searchMode = null;
      const shown = chats;
      list.innerHTML = shown.map((c) => chatRow(c, chatId)).join('') ||
        `<li><div class="empty"><h3>还没有会话</h3><p>启动账号收到消息后，会话会出现在这里。</p></div></li>`;
    } else if (searchMode) {
      const parts = [];
      if (searchMode.chats.length) {
        parts.push(searchMode.chats.map((c) => chatRow(c, chatId)).join(''));
      }
      if (searchMode.messages.length) {
        parts.push('<li><div class="t-caption" style="color:var(--fg-4);padding:8px 12px">消息命中</div></li>');
        parts.push(searchMode.messages.map((m) => `
          <li><button class="chat-item press" data-chat="${enc(m.conversation_id)}">
            ${avatarImg(m.nick || m.sender || '', 'lg', m.sender, a.id)}
            <span class="meta">
              <span class="r1"><span class="name">${X(m.nick || m.sender || m.conversation_id)}</span><span class="time">${fmtTime(m.time / 1000)}</span></span>
              <span class="r2">${X((m.text || '[消息]').slice(0, 60))}</span>
            </span>
          </button></li>`).join(''));
      }
      list.innerHTML = parts.join('') ||
        `<li><div class="empty"><h3>没有匹配的结果</h3><p>换个关键词试试。</p></div></li>`;
    } else {
      const shown = chats.filter((c) => (c.title || '').toLowerCase().includes(s));
      list.innerHTML = shown.map((c) => chatRow(c, chatId)).join('') ||
        `<li><div class="empty"><h3>没有匹配的会话</h3><p>换个关键词试试。</p></div></li>`;
    }
    list.querySelectorAll('[data-chat]').forEach((el) => el.onclick = () => nav(`/a/${enc(a.id)}/chats/${el.dataset.chat}`));
  };
  const chatRow = (c, cur) => `
    <li><button class="chat-item press ${c.id === cur ? 'on' : ''}" data-chat="${enc(c.id)}">
      ${/^\\d+$/.test(c.id) ? avatarImg(c.title, 'lg', c.id, a.id) : avatar(c.title, 'lg')}
      <span class="meta">
        <span class="r1"><span class="name">${X(c.title)}</span><span class="time">${fmtTime(c.last_time / 1000)}</span></span>
        <span class="r2">${X(c.last_direction === 'out' ? '我：' : '')}${X(c.last || '[消息]')}</span>
      </span>
    </button></li>`;
  let searchTimer = 0;
  qEl.oninput = () => {
    clearTimeout(searchTimer);
    const v = qEl.value;
    if (!v.trim()) { drawList(''); return; }
    searchTimer = setTimeout(() => runSearch(v), 250);
  };
  await loadList();
  usePoll(loadList, 6000, 'chats');
  if (chatId) mountThread(a, chatId);
  else {
    document.getElementById('thread').innerHTML = `<div class="center-wrap"><div class="empty">
      <div class="icon">${icon('msgs')}</div><h3>选择一个会话</h3><p>在左边选一个会话查看聊天记录。</p></div></div>`;
    if (chats.length && matchMedia('(min-width: 821px)').matches) nav(`/a/${enc(a.id)}/chats/${enc(chats[0].id)}`);
  }
}

async function mountThread(a, chatId) {
  const box = document.getElementById('thread');
  let msgs = [], stick = true;
  const chatInfo = { title: chatId };
  box.innerHTML = `
    <div class="thread">
      <div class="thread-head">${/^\d+$/.test(chatId) ? avatarImg(chatInfo.title, 'md', chatId, a.id) : avatar(chatInfo.title, 'md')}<h2 id="th-name">${X(chatId)}</h2>
        <span class="tag">${/^\d+$/.test(chatId) ? '私聊' : ':' in chatId ? '群聊' : '会话'}</span>
        <span style="margin-left:auto"></span>
        <label style="display:inline-flex;cursor:pointer;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--fg-2)">
          Agent
          <button type="button" class="switch press" id="th-agent" role="switch" aria-label="这个会话启用 agent"></button>
        </label>
        ${btn(icon('x'), 'ghost', 'icon-sm', '', 'id="th-reset" title="开启新的 Agent 上下文" aria-label="开启新会话"')}
      </div>
      <div class="thread-box" id="th-box"><div class="thread-inner" id="th-inner"></div></div>
      <div class="composer"><div class="composer-inner">
        <textarea id="th-draft" rows="1" placeholder="${isActive(a.state) ? `发送给 ${X(chatInfo.title)}，Enter 发送` : '启动账号后才能发送'}"></textarea>
        ${btn(icon('send'), 'primary', 'icon', '', 'id="th-send" aria-label="发送"')}
      </div></div>
    </div>`;
  const inner = document.getElementById('th-inner');
  const scroller = document.getElementById('th-box');
  const draft = document.getElementById('th-draft');
  const sendBtn = document.getElementById('th-send');
  scroller.onscroll = () => { stick = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 40; };

  // 每会话 agent 开关 (从 settings.triggers 名单读初始态)
  const agBtn = document.getElementById('th-agent');
  if (agBtn) {
    api('GET', `/accounts/${enc(a.id)}/settings`).then((s) => {
      const t = s.triggers || {};
      const inc = t.include_chats || [], exc = t.exclude_chats || [];
      const on = !exc.includes(chatId) && (!inc.length || inc.includes(chatId));
      agBtn.classList.toggle('on', on);
    }).catch(() => {});
    agBtn.onclick = async () => {
      const on = !agBtn.classList.contains('on');
      agBtn.classList.toggle('on', on);
      try {
        await api('PUT', `/accounts/${enc(a.id)}/chats/${enc(chatId)}/agent`, { enabled: on });
        toast(on ? '这个会话已启用 Agent' : '这个会话已停用 Agent');
      } catch (e) { toast(e.message, true); agBtn.classList.toggle('on', !on); }
    };
  }

  const draw = () => {
    const byDay = [];
    let prev = null;
    for (const m of msgs) {
      const grouped = prev && prev.direction === m.direction && prev.sender === m.sender && m.time - prev.time < 300000 && fmtDay(prev.time / 1000) === fmtDay(m.time / 1000);
      byDay.push({ m, grouped, newDay: !prev || fmtDay(prev.time / 1000) !== fmtDay(m.time / 1000) });
      prev = m;
    }
    inner.innerHTML = byDay.map((it) => {
      const { m, grouped, newDay } = it;
      const out = m.direction === 'out';
      const media = !m.text;
      return `${newDay && m.time ? `<div class="day-chip"><span>${fmtDay(m.time / 1000)}</span></div>` : ''}
        <div class="msg-row ${out ? 'out' : 'in'} ${grouped ? 'grouped' : ''}">
          ${out ? '' : grouped ? '<span class="msg-spacer"></span>' : avatarImg(m.nick || m.sender || '', 'sm', m.sender, a.id)}
          <div class="msg-col">
            ${!grouped && !out ? `<span class="msg-sender">${X(m.nick || m.sender || '')}</span>` : ''}
            <div class="bubble ${out ? 'out' : 'in'}${media ? ' media' : ''}" title="${fmtTime(m.time / 1000)}">${media ? '[消息]' : X(m.text)}</div>
          </div>
        </div>`;
    }).join('');
    if (stick) scroller.scrollTop = scroller.scrollHeight;
  };

  const load = async () => {
    try {
      const r = await api('GET', `/accounts/${enc(a.id)}/chats/${enc(chatId)}/messages?limit=200`);
      msgs = r.messages || [];
      if (r.title) {
        chatInfo.title = r.title;
        document.getElementById('th-name').textContent = r.title;
        draft.placeholder = isActive(a.state) ? `发送给 ${r.title}，Enter 发送` : draft.placeholder;
      }
      draw();
    } catch {}
  };
  await load();
  usePoll(load, 3000, 'thread');

  const send = async () => {
    const text = draft.value.trim();
    if (!text || sendBtn.disabled) return;
    sendBtn.disabled = true;
    try {
      const r = await api('POST', `/accounts/${enc(a.id)}/chats/${enc(chatId)}/send`, { text });
      if (r.status !== 200) throw new Error(`发送失败 ${r.status}`);
      draft.value = '';
      stick = true;
      await load();
    } catch (e) { toast(e.message || '发送失败', true); }
    finally { sendBtn.disabled = false; }
  };
  const resetBtn = document.getElementById('th-reset');
  if (resetBtn) resetBtn.onclick = async () => {
    resetBtn.disabled = true;
    try {
      await api('POST', `/accounts/${enc(a.id)}/chats/${enc(chatId)}/reset`);
      toast('已清空该会话的 agent 上下文');
    } catch (e) { toast(e.message, true); }
    finally { resetBtn.disabled = false; }
  };
  sendBtn.onclick = send;
  draft.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  };
  if (!isActive(a.state)) sendBtn.disabled = true;
}

/* ============================================================
   页面: 记忆 (长期记忆, § 分隔, 2000 字上限)
   ============================================================ */
function pageMemory(a) {
  return `<div class="page-scroll" style="height:100%">
    <div class="fade-in" style="max-width:760px;margin:0 auto;padding:32px 24px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
        <div style="min-width:0;flex:1">
          <h1 class="t-title" style="font-weight:500">长期记忆</h1>
          <p class="t-small" style="color:var(--fg-3)">所有会话共用。Agent 会用 ding memory 增删改，你也可以在这里修改。</p>
        </div>
        ${btn(icon('refresh') + '立即回顾', 'secondary', '', '', 'id="mem-review"')}
      </div>
      <div id="mem-warn"></div>
      <div id="mem-meter"></div>
      <div class="card" style="overflow:hidden">
        <div id="mem-rows"></div>
        <div style="display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-1);padding:12px">
          <input class="input" id="mem-new" maxlength="2000" placeholder="添加一条，例如：陈思远：后端负责人，喜欢先看结论" style="flex:1">
          ${btn(icon('plus') + '添加', 'secondary', '', '', 'id="mem-add"')}
        </div>
      </div>
    </div>
  </div>`;
}
function memRow(e, i, editing, editText) {
  const n = i + 1;
  if (editing === n) {
    return `<li style="display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-1)" data-mem="${i}">
      <span style="min-width:24px;padding-top:2px;text-align:right;color:var(--fg-4);font-size:12px" class="tabular">${n}</span>
      <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:8px">
        <textarea class="textarea" data-mem-text maxlength="2000">${X(editText)}</textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          ${btn('取消', 'ghost', 'sm', '', 'data-mem-cancel')}
          ${btn(icon('check') + '保存', 'primary', 'sm', '', 'data-mem-save')}
        </div>
      </div>
    </li>`;
  }
  return `<li style="display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-1)" data-mem="${i}">
    <span style="min-width:24px;padding-top:2px;text-align:right;color:var(--fg-4);font-size:12px" class="tabular">${n}</span>
    <p style="min-width:0;flex:1;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;line-height:22px">${X(e)}</p>
    ${btn(icon('rotate'), 'ghost', 'icon-sm', '', `data-mem-edit aria-label="修改第 ${n} 条"`)}
    ${btn(icon('trash'), 'ghost', 'icon-sm', '', `data-mem-del aria-label="删除第 ${n} 条"`)}
  </li>`;
}
function mountMemory(a) {
  const rows = document.getElementById('mem-rows');
  const meter = document.getElementById('mem-meter');
  const warn = document.getElementById('mem-warn');
  let data = null, editing = 0, editText = '';
  const drawAll = () => {
    if (!data) return;
    const items = data.entries || [];
    rows.innerHTML = items.length
      ? `<ol style="list-style:none">${items.map((e, i) => memRow(e, i, editing, editText)).join('')}</ol>`
      : '<div class="empty" style="padding:32px"><h3>还没有记忆</h3><p>Agent 遇到值得长期记住的事会自己记下，你也可以在下面添加。</p></div>';
    // 用量进度条
    const used = (data.usage || '').match(/\d+/);
    const pct = data.limit ? Math.min(100, Math.round((data.used / data.limit) * 100)) : (used ? Math.min(100, Math.round(Number(used[0]) / 20)) : 0);
    meter.innerHTML = `<div style="margin-bottom:6px;display:flex;align-items:baseline;justify-content:space-between;font-size:12px;line-height:18px;color:var(--fg-3)">
        <span>已用 <b class="tabular" style="color:var(--fg-1)">${data.used ?? used ? data.used : used[0]}</b> / ${data.limit || 2000} 字，写满后要先删除或合并旧条目</span>
        ${data.last_review ? `<span>上次回顾 ${X(data.last_review)}</span>` : ''}</div>
      <div style="height:6px;overflow:hidden;border-radius:999px;background:var(--fill-2)">
        <div style="height:100%;border-radius:999px;background:${pct >= 90 ? 'var(--warn, #d97706)' : 'var(--accent)'};width:${pct}%"></div></div>`;
    warn.innerHTML = (!a.memory)
      ? `<div style="border-radius:10px;background:var(--fill-2);padding:12px 16px;font-size:13px;line-height:20px;color:var(--fg-2)">长期记忆没有开启，Agent 不会读取这些内容。<button data-nav="/a/${enc(a.id)}/settings" class="recent-head-link" style="padding:0">到设置里开启</button></div>`
      : '';
    renderShellInnerFix();
    bindRows();
  };
  const load = () => api('GET', `/accounts/${enc(a.id)}/memory`).then((d) => { data = d; drawAll(); }).catch(() => {});
  const bindRows = () => {
    rows.querySelectorAll('[data-mem]').forEach((row) => {
      const i = Number(row.dataset.mem);
      const n = i + 1;
      const edit = row.querySelector('[data-mem-edit]');
      if (edit) edit.onclick = () => { editing = n; editText = data.entries[i]; drawAll(); };
      const cancel = row.querySelector('[data-mem-cancel]');
      if (cancel) cancel.onclick = () => { editing = 0; editText = ''; drawAll(); };
      const save = row.querySelector('[data-mem-save]');
      if (save) save.onclick = async () => {
        const text = row.querySelector('[data-mem-text]').value.trim();
        if (!text) return;
        try { data = await api('PUT', `/accounts/${enc(a.id)}/memory/${n}`, { text }); editing = 0; editText = ''; drawAll(); toast('已保存'); }
        catch (e) { toast(e.message, true); }
      };
      const del = row.querySelector('[data-mem-del]');
      if (del) del.onclick = async () => {
        try { data = await api('DELETE', `/accounts/${enc(a.id)}/memory/${n}`); if (editing === n) editing = 0; drawAll(); toast('已删除'); }
        catch (e) { toast(e.message, true); }
      };
    });
  };
  load();
  usePoll(() => { if (!editing) load(); }, 5000, 'mem');
  const revBtn = document.getElementById('mem-review');
  if (revBtn) revBtn.onclick = async () => {
    revBtn.disabled = true;
    try {
      const r = await api('POST', `/accounts/${enc(a.id)}/memory/review`);
      toast(r.result === 'empty' ? '最近 24 小时没有聊天，不需要回顾' : '已开始回顾，整理完后这里会更新');
      setTimeout(load, 2000);
    } catch (e) { toast(e.message, true); }
    finally { revBtn.disabled = false; }
  };
  document.getElementById('mem-add').onclick = async () => {
    const el = document.getElementById('mem-new');
    const text = el.value.trim();
    if (!text) return;
    try { data = await api('POST', `/accounts/${enc(a.id)}/memory`, { text }); el.value = ''; drawAll(); }
    catch (e) { toast(e.message, true); }
  };
  document.getElementById('mem-new').onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('mem-add').click(); }
  };
}

function ruleRow(r) {
