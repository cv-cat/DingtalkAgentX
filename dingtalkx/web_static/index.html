function mountSettings(a) {
  // ---- 脏保存条: 任何输入变化即显示, 保存/放弃后隐藏 ----
  const dirtyBar = document.getElementById('dirty-bar');
  const markDirty = () => { if (dirtyBar) dirtyBar.hidden = false; };
  const clearDirty = () => { if (dirtyBar) dirtyBar.hidden = true; };
  const form = document.querySelector('.set-form');
  const agentSection = document.getElementById('s-agent');
  if (form && agentSection) {
    // 只盯数字人 section (autostart/规则有自己的保存路径)
    agentSection.addEventListener('input', markDirty);
    agentSection.addEventListener('change', markDirty);
  }
  const dirtySave = document.getElementById('dirty-save');
  const dirtyDiscard = document.getElementById('dirty-discard');
  if (dirtySave) dirtySave.onclick = async () => {
    const btn = document.getElementById('agent-save');
    if (btn) { await btn.onclick(); }
    clearDirty();
  };
  if (dirtyDiscard) dirtyDiscard.onclick = () => { clearDirty(); render(); };
  document.querySelectorAll('[data-set]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('[data-set]').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('s-' + b.dataset.set).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const auto = document.getElementById('set-autostart');
  if (auto) auto.onclick = async () => {
    const on = !auto.classList.contains('on');
    auto.classList.toggle('on', on);
    await attempt(async () => {
      const cur = await api('GET', `/accounts/${enc(a.id)}/settings`);
      cur.autostart = on;
      await api('PUT', `/accounts/${enc(a.id)}/settings`, cur);
    });
  };
  const rows = document.getElementById('rule-rows');
  const addRow = () => { rows.insertAdjacentHTML('beforeend', ruleRow({ enabled: true })); bindRows(); };
  document.getElementById('rule-add').onclick = addRow;
  const bindRows = () => {
    rows.querySelectorAll('[data-rule]').forEach((row) => {
      row.querySelector('[data-rule-enabled]').onclick = (e) => e.currentTarget.classList.toggle('on');
      row.querySelector('[data-rule-del]').onclick = () => row.remove();
    });
  };
  bindRows();
  document.getElementById('rule-save').onclick = async () => {
    const list = [...rows.querySelectorAll('[data-rule]')].map((row) => ({
      enabled: row.querySelector('[data-rule-enabled]').classList.contains('on'),
      trigger: row.querySelector('[data-rule-trigger]').value,
      reply: row.querySelector('[data-rule-reply]').value,
    })).filter((r) => r.trigger.trim());
    await attempt(async () => {
      const cur = await api('GET', `/accounts/${enc(a.id)}/settings`);
      cur.rules = list;
      await api('PUT', `/accounts/${enc(a.id)}/settings`, cur);
      toast(list.length ? `已保存 ${list.length} 条规则，对运行中的账号立即生效` : '已清空规则');
    });
  };
  const del = document.getElementById('acc-del');
  if (del) del.onclick = () => openConfirm(`删除「${a.name}」?`, '会停止运行并删除登录凭证、设置和规则，消息库保留。', '删除', async () => {
    await attempt(async () => { await api('DELETE', `/accounts/${enc(a.id)}`); await refresh(); toast('已删除'); nav('/accounts'); });
  });
  // ---- agent 设置 ----
  const beBtns = document.getElementById('agent-backends');
  let picked = null;
  if (beBtns) {
    const sync = () => beBtns.querySelectorAll('[data-be]').forEach((b) => {
      b.classList.toggle('btn-primary', b.dataset.be === (picked || (S.accounts.find((x) => x.id === a.id) || {}).backend));
      b.classList.toggle('btn-secondary', b.dataset.be !== (picked || (S.accounts.find((x) => x.id === a.id) || {}).backend));
    });
    beBtns.querySelectorAll('[data-be]').forEach((b) => b.onclick = () => { picked = b.dataset.be; sync(); });
  }
  const profBtn = document.getElementById('prof-refresh');
  if (profBtn) profBtn.onclick = async () => {
    profBtn.disabled = true;
    try {
      await api('POST', `/accounts/${enc(a.id)}/profile/refresh`);
      await refresh(); toast('资料已刷新');
      render();
    } catch (e) { toast(e.message, true); }
    finally { profBtn.disabled = false; }
  };
  const memSwitch = document.getElementById('set-memory');
  if (memSwitch) memSwitch.onclick = () => memSwitch.classList.toggle('on');
  const dmSwitch = document.getElementById('tg-dm');
  if (dmSwitch) dmSwitch.onclick = () => dmSwitch.classList.toggle('on');
  const atSwitch = document.getElementById('tg-at');
  if (atSwitch) atSwitch.onclick = () => atSwitch.classList.toggle('on');
  const split = (v) => (v || '').split(/[,，]/).map((x) => x.trim()).filter(Boolean);
  // PeopleInput: 按名字搜索挂 uid chips (数据存 box.dataset.ids, 逗号分隔; chips 统一由 drawAllChips 画)
  document.querySelectorAll('[data-people]').forEach((box) => {
    box.innerHTML = `<input class="people-input" autocomplete="off"><div class="people-drop" hidden></div>`;
    const input = box.querySelector('.people-input');
    const drop = box.querySelector('.people-drop');
    let timer = 0, items = [];
    const add = (p) => {
      const cur = (box.dataset.ids || '').split(',').filter(Boolean);
      if (!cur.includes(p.id)) cur.push(p.id);
      box.dataset.ids = cur.join(',');
      input.value = ''; drop.hidden = true; drop.innerHTML = '';
      box.dispatchEvent(new CustomEvent('ids-changed'));
    };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = input.value.trim();
        if (!v) return;
        if (/^\d+$/.test(v)) add({ id: v, name: '' });
        else if (items.length) add(items[0]);
      } else if (e.key === 'Backspace' && !input.value) {
        const cur = (box.dataset.ids || '').split(',').filter(Boolean);
        cur.pop();
        box.dataset.ids = cur.join(',');
        box.dispatchEvent(new CustomEvent('ids-changed'));
      } else if (e.key === 'Escape') { drop.hidden = true; }
    };
    input.oninput = () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q || /^\d+$/.test(q)) { drop.hidden = true; return; }
      timer = setTimeout(async () => {
        try { items = await api('GET', `/accounts/${enc(a.id)}/people?q=${enc(q)}`); } catch { items = []; }
        drop.innerHTML = items.length
          ? items.map((p) => `<button type="button" class="people-opt" data-pid="${X(p.id)}">${avatarImg(p.name || p.id, 'sm', p.id, a.id)}<span style="min-width:0;flex:1"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">${X(p.name || p.id)}</span><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--fg-3)">${X([p.desc, p.id].filter(Boolean).join(' · '))}</span></span></button>`).join('')
          : '<div style="padding:8px;font-size:13px;color:var(--fg-3)">没有找到</div>';
        drop.hidden = false;
        drop.querySelectorAll('[data-pid]').forEach((b) => b.onmousedown = (e) => { e.preventDefault(); add(items.find((x) => x.id === b.dataset.pid)); });
      }, 300);
    };
    input.onblur = () => setTimeout(() => { drop.hidden = true; }, 150);
    box.addEventListener('ids-changed', () => window.dispatchEvent(new Event('dx-chips')));
  });
  // 初始值 + 联动重画
  const drawAllChips = () => {
    document.querySelectorAll('[data-people]').forEach((box) => {
      const ids = (box.dataset.ids || '').split(',').filter(Boolean);
      box.querySelectorAll('.people-chip').forEach((c) => c.remove());
      const input = box.querySelector('.people-input');
      for (const id of ids) {
        const chip = document.createElement('span');
        chip.className = 'people-chip';
        chip.title = `user_id ${id}`;
        chip.innerHTML = `<span style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--fill-3);font-size:10px;color:var(--fg-2)">${X((id[0] || '?').toUpperCase())}</span><span style="max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${X(id)}</span><button type="button" aria-label="移除">${icon('x')}</button>`;
        chip.querySelector('button').onclick = () => {
          box.dataset.ids = (box.dataset.ids || '').split(',').filter((x) => x && x !== id).join(',');
          drawAllChips();
        };
        box.insertBefore(chip, input);
      }
      input.placeholder = ids.length ? '' : '输入名字搜索或粘贴 uid 回车';
    });
  };
  window.addEventListener('dx-chips', drawAllChips);
  const peopleInit = async () => {
    try {
      const s = await api('GET', `/accounts/${enc(a.id)}/settings`);
      const t = s.triggers || {};
      document.querySelectorAll('[data-people]').forEach((box) => {
        box.dataset.ids = (t[box.dataset.people] || []).join(',');
      });
      drawAllChips();
      // 名字异步补齐 (uid → name)
      const allIds = document.querySelectorAll('[data-people]').length
        ? [...document.querySelectorAll('[data-people]')].flatMap((b) => (b.dataset.ids || '').split(',').filter(Boolean)) : [];
      if (allIds.length) {
        try {
          const known = {};
          (await api('GET', `/accounts/${enc(a.id)}/people?ids=${enc(allIds.join(','))}`)).forEach((p) => known[p.id] = p);
          document.querySelectorAll('[data-people]').forEach((box) => {
            const ids = (box.dataset.ids || '').split(',').filter(Boolean);
            box.querySelectorAll('.people-chip').forEach((chip, i) => {
              const p = known[ids[i]];
              if (p && p.name) {
                const span = chip.querySelectorAll('span')[1];
                if (span) span.textContent = p.name;
                chip.title = p.name + ` · user_id ${p.id}`;
              }
            });
          });
        } catch {}
      }
    } catch {}
  };
  peopleInit();
  const saveBtn = document.getElementById('agent-save');
  if (saveBtn) saveBtn.onclick = async () => {
    await attempt(async () => {
      const cur = await api('GET', `/accounts/${enc(a.id)}/settings`);
      const row = S.accounts.find((x) => x.id === a.id) || {};
      cur.agent_backend = picked || row.backend || 'none';
      cur.agent_model = document.getElementById('ag-model').value.trim() || null;
      cur.agent_timeout = Number(document.getElementById('ag-timeout').value) || 0;
      cur.workdir = document.getElementById('ag-workdir').value.trim() || null;
      cur.system_prompt = document.getElementById('ag-sys').value.trim() || null;
      cur.memory_enabled = memSwitch.classList.contains('on');
      const idsOf = (key) => (document.querySelector(`[data-people="${key}"]`) || {}).dataset
        ? (document.querySelector(`[data-people="${key}"]`).dataset.ids || '').split(',').filter(Boolean) : [];
      cur.triggers = {
        ...(cur.triggers || {}),
        prefix: document.getElementById('tg-prefix').value.trim() || null,
        keywords: split(document.getElementById('tg-keywords').value),
        dm_enabled: dmSwitch.classList.contains('on'),
        group_at_only: atSwitch.classList.contains('on'),
        include_senders: idsOf('include_senders'),
        exclude_senders: idsOf('exclude_senders'),
      };
      await api('PUT', `/accounts/${enc(a.id)}/settings`, cur);
      toast('已保存, 重启账号后生效');
      const bar = document.getElementById('dirty-bar');
      if (bar) bar.hidden = true;
    });
  };
}

/* ============================================================
   页面: 日志
   ============================================================ */
function pageLogs(a) {
  return `<div class="fade-in logs-wrap">
    <div><h1 class="t-title" style="font-weight:500">日志</h1>
    <p class="t-small" style="color:var(--fg-3)">这个账号的连接、推送和规则触发记录，只保留最近 400 条在内存里。</p></div>
    <div class="log-card"><div class="log-box" id="log-box"></div></div>
  </div>`;
}
function mountLogs(a) {
  const box = document.getElementById('log-box');
  let since = 0, stick = true;
  box.onscroll = () => { stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 24; };
  const pull = async () => {
    try {
      const r = await api('GET', `/accounts/${enc(a.id)}/logs?since=${since}`);
      const fresh = r.logs || [];
      if (!fresh.length) return;
      since = fresh[fresh.length - 1].seq;
      box.insertAdjacentHTML('beforeend', fresh.map((l) =>
        `<div class="log-line ${l.level === 'ERROR' ? 'error' : l.level === 'WARN' ? 'warn' : ''}"><span class="t">${X(l.time)}</span>${X(l.text)}</div>`).join(''));
      if (stick) box.scrollTop = box.scrollHeight;
    } catch {}
  };
  pull();
  usePoll(pull, 1500, 'logs');
}

/* ============================================================
   主渲染
   ============================================================ */
let pageCleanup = [];
function cleanup() { pageCleanup.forEach((f) => { try { f(); } catch {} }); pageCleanup = []; for (const k of Object.keys(window)) if (k.startsWith('_p')) { clearInterval(window[k + '_t']); delete window[k]; delete window[k + '_t']; } }

async function refresh() {
  try {
    const [meta, accounts, runtimes] = await Promise.all([api('GET', '/meta'), api('GET', '/accounts'), api('GET', '/runtimes')]);
    S.meta = meta; S.accounts = accounts; S.runtimes = runtimes; S.loaded = true; S.error = '';
  } catch (e) {
    S.loaded = true; S.error = e.message;
    try { const accounts = await api('GET', '/accounts'); S.accounts = accounts; } catch { S.accounts = []; }
  }
}

let lastViewKey = '';
async function render() {
  const r = parseHash();
  const a = S.accounts.find((x) => x.id === r.id);

  // 入口跳转: 1 个账号直接进, 多个进列表
  if (S.loaded && !S.error) {
    if (r.view === 'entry') {
      if (S.accounts.length === 0) { nav('/home'); return; }
      if (S.accounts.length === 1) { nav(`/a/${enc(S.accounts[0].id)}/overview`); return; }
      if (S.accounts.length > 1) { nav('/accounts'); return; }
    } else if (r.view === 'account' && !a) { nav('/accounts'); return; }
  }

  const viewKey = r.view + '|' + r.id + '|' + r.tab + '|' + (r.view === 'account' ? 1 : 0);
  let inner = '', mount = null;

  if (r.view === 'home') {
    inner = pageHome();
    mount = () => { cleanup(); pageCleanup = []; mountHome(); };
  }
  else if (r.view === 'entry') { inner = pageEntry(); }
  else if (r.view === 'accounts') {
    inner = pageAccounts();
    mount = () => {
      const add = document.getElementById('acc-add');
      if (add) add.onclick = openAddDialog;
      bindActs();
    };
  } else if (a) {
    if (r.tab === 'chats') {
      inner = pageChats(a);
      mount = async () => {
        cleanup(); pageCleanup = [];
        await mountChats(a, r.chat);
      };
    } else if (r.tab === 'memory') {
      inner = pageMemory(a);
      mount = () => { cleanup(); pageCleanup = []; mountMemory(a); };
    } else if (r.tab === 'settings') {
      inner = pageSettings(a, null);
      mount = async () => {
        const detail = await attempt(() => api('GET', `/accounts/${enc(a.id)}`));
        // 重新渲染 settings 带上 detail
        document.querySelector('.main').innerHTML = pageSettings(a, detail);
        renderShellInnerFix();
        mountSettings(a);
        bindActs();
      };
    } else if (r.tab === 'logs') {
      inner = pageLogs(a);
      mount = () => { cleanup(); pageCleanup = []; mountLogs(a); };
    } else {
      inner = pageOverview(a, null);
      mount = async () => {
        const data = await attempt(() => api('GET', `/accounts/${enc(a.id)}/overview`));
        document.querySelector('.main').innerHTML = pageOverview(a, data);
        renderShellInnerFix();
        bindActs();
        bindWeekTips();
        loadTasksCard(a);
      };
    }
  } else {
    inner = pageEntry();
  }

  renderShell(inner);
  if (r.view === 'entry' && S.loaded && !S.error && !S.accounts.length) {
    const slot = document.querySelector('.login-slot');
    if (slot && !slot.firstChild) {
      const cancel = mountLogin(slot, async (id) => { await refresh(); toast('登录成功'); nav(`/a/${enc(id)}/overview`); });
      pageCleanup.push(cancel);
    }
  }
  if (mount) await mount();
  lastViewKey = viewKey;
}

function renderShellInnerFix() {
  // 重新挂外壳事件 (data-nav / theme / account menu)
  document.querySelectorAll('[data-nav]').forEach((el) => el.onclick = () => nav(el.dataset.nav));
  bindAccountMenu();
}

function bindWeekTips() {
  document.querySelectorAll('.wk-col').forEach((col) => {
    col.onmouseenter = () => {
      const tip = document.createElement('div');
      tip.className = 'wk-tip';
      tip.textContent = col.dataset.tip;
      col.appendChild(tip);
    };
    col.onmouseleave = () => { const t = col.querySelector('.wk-tip'); if (t) t.remove(); };
  });
}

async function loadTasksCard(a) {
  const body = document.getElementById('tasks-body');
  if (!body) return;
  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const draw = (tasks) => {
    if (!tasks || !tasks.length) {
      body.innerHTML = '还没有定时任务。可以让 Agent 安排，比如「30 分钟后提醒我交周报」，也可以用 ding task add 创建。';
      return;
    }
    body.innerHTML = `<ul style="list-style:none;margin:0;padding:0">${tasks.map((t) => `
      <li style="display:flex;align-items:center;gap:12px;padding:6px 0">
        <span style="width:128px;flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--fg-2)">${esc(t.kind === 'daily' ? '每天 ' + t.daily_at : new Date((t.run_at || 0) * 1000).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }))}</span>
        <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.content)}</span>
        <span style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--fg-3)">${esc(t.chat_id)}</span>
        <button class="press" data-task-del="${t.id}" aria-label="删除这个定时任务" style="border:none;background:none;color:var(--fg-3);cursor:pointer;padding:4px;display:inline-flex">${icon('trash')}</button>
      </li>`).join('')}</ul>`;
    body.querySelectorAll('[data-task-del]').forEach((b) => b.onclick = async () => {
      await attempt(async () => { await api('DELETE', `/accounts/${enc(a.id)}/tasks/${b.dataset.taskDel}`); await loadTasksCard(a); toast('已删除定时任务'); });
    });
  };
  try { draw(await api('GET', `/accounts/${enc(a.id)}/tasks`)); } catch { body.textContent = '加载失败'; }
}

function bindActs() {
  document.querySelectorAll('[data-act]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.id, what = b.dataset.act;
      if (what === 'del') {
        openConfirm(`删除账号?`, '会停止运行并删除登录凭证、设置和规则。', '删除', async () => {
          await attempt(async () => { await api('DELETE', `/accounts/${enc(id)}`); await refresh(); toast('已删除'); if (parseHash().id === id) nav('/accounts'); });
        });
        return;
      }
      await attempt(async () => { await api('POST', `/accounts/${enc(id)}/${what}`); await refresh(); });
    };
  });
}

/* ---------- 启动 ---------- */
window.addEventListener('hashchange', () => { render(); });
(async function boot() {
  await refresh();
  await render();
  // 顶层账号列表轮询 (驱动 StateDot / 状态徽章)
  setInterval(async () => {
    if (document.hidden) return;
    await refresh();
    const r = parseHash();
    // 概览/账号页: 静默重渲染 (不动聊天和设置的输入框)
    if (r.view === 'accounts' || (r.view === 'account' && r.tab === 'overview')) {
      if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      const hadMenu = !document.getElementById('acc-menu') || document.getElementById('acc-menu').hidden;
      await render();
      if (!hadMenu) document.getElementById('acc-menu').hidden = false;
    }
  }, 5000);
})();
</script>
</body>
</html>
